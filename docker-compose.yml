services:
  git-forest:
    build: .
    container_name: git-forest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Uses the env var from Coolify, falls back to a default for local testing
      - GIT_SECRET=${GIT_SECRET:-change_this_secret_in_production}
    volumes:
      - forest-data:/app

volumes:
  forest-data: